<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krzyżówka – Giganci Programowania</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F58220;
    --orange-light: #F8E2CB;
    --orange-mid: #F4CAA0;
    --purple: #6F499D;
    --purple-light: #D4CFE5;
    --purple-mid: #B4A8CE;
    --dark: #2D2D2D;
    --gray-bg: #F5F5F5;
    --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--gray-bg);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === DECORATIVE BACKGROUND === */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 10% 20%, rgba(111,73,157,0.08) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(245,130,32,0.08) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(111,73,157,0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--purple);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .header h1 span {
    color: var(--orange);
  }

  .header p {
    font-size: 0.95rem;
    color: #777;
    font-weight: 500;
  }

  /* === INSTRUCTION BADGE === */
  .instruction {
    background: linear-gradient(135deg, var(--purple), #8B6DB5);
    color: white;
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 28px;
    font-size: 0.92rem;
    line-height: 1.6;
    box-shadow: 0 4px 16px rgba(111,73,157,0.2);
  }

  .instruction strong { color: var(--orange-light); }

  /* === CROSSWORD GRID === */
  .crossword-section {
    margin-bottom: 32px;
  }

  .word-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 6px;
  }

  .word-number {
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--purple);
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }

  .cells-wrapper {
    display: flex;
    gap: 3px;
  }

  .cell {
    position: relative;
    width: clamp(32px, 7vw, 44px);
    height: clamp(32px, 7vw, 44px);
    border: 2px solid var(--purple-mid);
    border-radius: 6px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1rem, 3vw, 1.35rem);
    font-weight: 700;
    color: var(--dark);
    text-transform: uppercase;
    caret-color: var(--orange);
  }

  .cell.highlight {
    background: linear-gradient(145deg, #FFF3E0, #FFE0B2);
    border-color: var(--orange);
    box-shadow: 0 2px 8px rgba(245,130,32,0.25);
  }

  .cell.highlight input {
    color: var(--orange);
  }

  .cell .badge {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--orange);
    color: white;
    font-size: 0.6rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    z-index: 2;
  }

  .cell input:focus {
    background: rgba(245,130,32,0.06);
  }

  .cell.correct {
    border-color: #4CAF50;
    background: #E8F5E9;
  }

  .cell.correct input { color: #2E7D32; }

  .cell.wrong {
    border-color: #E53935;
    background: #FFEBEE;
    animation: shake 0.4s;
  }

  .cell.wrong input { color: #C62828; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-3px); }
    40%, 80% { transform: translateX(3px); }
  }

  /* === DEFINITIONS === */
  .definitions {
    background: var(--white);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-left: 4px solid var(--purple);
  }

  .definitions h3 {
    font-family: 'Baloo 2', cursive;
    color: var(--purple);
    font-size: 1.1rem;
    margin-bottom: 10px;
  }

  .def-item {
    margin-bottom: 8px;
    font-size: 0.88rem;
    line-height: 1.55;
    padding-left: 8px;
  }

  .def-item .def-num {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    color: var(--orange);
    margin-right: 4px;
    font-size: 1rem;
  }

  /* === KEYWORD SECTION === */
  .keyword-section {
    text-align: center;
    margin-bottom: 24px;
  }

  .keyword-section h3 {
    font-family: 'Baloo 2', cursive;
    color: var(--purple);
    font-size: 1.15rem;
    margin-bottom: 12px;
  }

  .keyword-cells {
    display: flex;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .kw-cell {
    width: clamp(30px, 7vw, 42px);
    height: clamp(36px, 8vw, 48px);
    border: 2.5px solid var(--orange);
    border-radius: 8px;
    background: linear-gradient(145deg, #FFF8F0, #FFF3E0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1rem, 3vw, 1.4rem);
    font-weight: 800;
    color: var(--orange);
    box-shadow: 0 3px 10px rgba(245,130,32,0.2);
    transition: all 0.3s;
  }

  .kw-cell .kw-num {
    font-size: 0.5rem;
    color: var(--purple);
    font-weight: 600;
    line-height: 1;
    margin-bottom: -2px;
    font-family: 'Quicksand', sans-serif;
  }

  .kw-cell.filled {
    background: linear-gradient(145deg, var(--orange), #E07518);
    color: white;
    transform: scale(1.05);
  }

  .kw-cell.filled .kw-num { color: rgba(255,255,255,0.7); }

  /* === BUTTON === */
  .btn-wrap { text-align: center; margin-bottom: 16px; }

  .btn-check {
    font-family: 'Baloo 2', cursive;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 12px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--purple), #8B6DB5);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(111,73,157,0.3);
    transition: all 0.25s;
    letter-spacing: 0.5px;
  }

  .btn-check:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(111,73,157,0.4);
  }

  .btn-check:active {
    transform: translateY(0);
  }

  /* === RESULT === */
  .result-msg {
    text-align: center;
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    min-height: 36px;
    margin-top: 8px;
  }

  .result-msg.success { color: #2E7D32; }
  .result-msg.partial { color: var(--orange); }

  /* === CONFETTI === */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    z-index: 9999;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* === RESPONSIVE === */
  @media (max-width: 600px) {
    .cells-wrapper { gap: 2px; }
    .word-row { gap: 4px; }
    .cell { border-width: 1.5px; }
    .cell .badge { width: 15px; height: 15px; font-size: 0.5rem; top: -6px; right: -6px; }
    .def-item { font-size: 0.82rem; }
  }

  /* === LANGUAGE SWITCHER === */
  .lang-switch {
    display: flex; justify-content: center; gap: 4px;
    width: fit-content; margin: 0 auto 20px; padding: 4px;
    background: var(--white); border-radius: 999px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .lang-btn {
    font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 700; letter-spacing: 1px;
    min-width: 46px; padding: 4px 12px; border: none; border-radius: 999px;
    background: transparent; color: #777; cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-btn:hover:not(.active) { background: var(--purple-light); color: var(--purple); }
  .lang-btn.active { background: linear-gradient(135deg, var(--purple), #8B6DB5); color: #fff; cursor: default; }
  .lang-btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
</style>
</head>

const crosswordEl = document.getElementById('crossword');
const keywordEl = document.getElementById('keyword-cells');
const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);

// === BUILD CROSSWORD (for the current language) ===
function buildCrossword() {
  crosswordEl.innerHTML = '';
  keywordEl.innerHTML = '';

  // Build keyword cells
  for (let i = 0; i < KEYWORD.length; i++) {
    const div = document.createElement('div');
    div.className = 'kw-cell';
    div.id = `kw-${i + 1}`;
    div.innerHTML = `<span class="kw-num">${i + 1}</span><span class="kw-letter">?</span>`;
    keywordEl.appendChild(div);
  }

  // Build word rows
  words.forEach((w, wi) => {
    const row = document.createElement('div');
    row.className = 'word-row';

    const num = document.createElement('div');
    num.className = 'word-number';
    num.textContent = w.num + '.';
    row.appendChild(num);

    const cellsWrap = document.createElement('div');
    cellsWrap.className = 'cells-wrapper';

    for (let ci = 0; ci < w.answer.length; ci++) {
      const cell = document.createElement('div');
      cell.className = 'cell';

      const kwPos = w.highlights[ci + 1];
      if (kwPos) {
        cell.classList.add('highlight');
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = kwPos;
        cell.appendChild(badge);
      }

      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 1;
      input.dataset.word = wi;
      input.dataset.cell = ci;
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('spellcheck', 'false');

      // Navigation
      input.addEventListener('input', function () {
        this.value = this.value.toUpperCase();
        updateKeyword();
        if (this.value.length === 1) {
          const next = getNextInput(wi, ci);
          if (next) next.focus();
        }
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && this.value === '') {
          const prev = getPrevInput(wi, ci);
          if (prev) { prev.focus(); prev.select(); }
        } else if (e.key === 'ArrowRight') {
          const next = getNextInput(wi, ci);
          if (next) next.focus();
        } else if (e.key === 'ArrowLeft') {
          const prev = getPrevInput(wi, ci);
          if (prev) prev.focus();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          const below = getInputAt(wi + 1, ci);
          if (below) below.focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const above = getInputAt(wi - 1, ci);
          if (above) above.focus();
        } else if (e.key === 'Enter') {
          checkAnswers();
        }
      });

      cell.appendChild(input);
      cellsWrap.appendChild(cell);
    }

    row.appendChild(cellsWrap);
    crosswordEl.appendChild(row);
  });
}

// === HELPERS ===
function getInput(wordIdx, cellIdx) {
  return document.querySelector(`input[data-word="${wordIdx}"][data-cell="${cellIdx}"]`);
}

function getNextInput(wi, ci) {
  if (ci + 1 < words[wi].answer.length) return getInput(wi, ci + 1);
  return null;
}

function getPrevInput(wi, ci) {
  if (ci - 1 >= 0) return getInput(wi, ci - 1);
  return null;
}

function getInputAt(wi, ci) {
  if (wi >= 0 && wi < words.length && ci >= 0 && ci < words[wi].answer.length) {
    return getInput(wi, ci);
  }
  return null;
}

function normalize(ch) {
  return ch.toUpperCase();
}

// === UPDATE KEYWORD LIVE ===
function updateKeyword() {
  words.forEach((w, wi) => {
    for (const [cellPos, kwPos] of Object.entries(w.highlights)) {
      const inp = getInput(wi, parseInt(cellPos) - 1);
      const kwCell = document.getElementById(`kw-${kwPos}`);
      const letterSpan = kwCell.querySelector('.kw-letter');
      if (inp && inp.value) {
        letterSpan.textContent = inp.value.toUpperCase();
        kwCell.classList.add('filled');
      } else {
        letterSpan.textContent = '?';
        kwCell.classList.remove('filled');
      }
    }
  });
}

// === CHECK ANSWERS ===
function checkAnswers() {
  let totalCorrect = 0;
  let totalCells = 0;

  words.forEach((w, wi) => {
    for (let ci = 0; ci < w.answer.length; ci++) {
      const inp = getInput(wi, ci);
      const cell = inp.parentElement;
      const expected = normalize(w.answer[ci]);
      const actual = normalize(inp.value);
      totalCells++;

      cell.classList.remove('correct', 'wrong');

      if (actual === expected) {
        cell.classList.add('correct');
        totalCorrect++;
      } else if (actual !== '') {
        cell.classList.add('wrong');
      }
    }
  });

  const msg = document.getElementById('result-msg');
  const t = I18N[lang];

  if (totalCorrect === totalCells) {
    msg.className = 'result-msg success';
    msg.textContent = fmt(t.success, { kw: KEYWORD });
    launchConfetti();
  } else {
    const pct = Math.round((totalCorrect / totalCells) * 100);
    msg.className = 'result-msg partial';
    msg.textContent = fmt(t.partial, { c: totalCorrect, t: totalCells, p: pct });
  }
}

// === CONFETTI ===
function launchConfetti() {
  const colors = ['#F58220', '#6F499D', '#FFD54F', '#4CAF50', '#E53935', '#2196F3', '#FF4081', '#E99B59', '#7D69A8'];
  const shapes = ['square', 'circle'];

  for (let i = 0; i < 150; i++) {
    setTimeout(() => {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = Math.random() * 10 + 6;
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)] === 'circle' ? '50%' : '2px';
      piece.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear forwards`;
      piece.style.animationDelay = Math.random() * 0.3 + 's';
      document.body.appendChild(piece);

      piece.addEventListener('animationend', () => piece.remove());
    }, i * 15);
  }
}

// === LANGUAGE SWITCHING ===
function saveTyped() {
  typed[lang] = Array.from(crosswordEl.querySelectorAll('input')).map(i => i.value);
}

function setLang(l, persist = true) {
  if (!LANGS.includes(l)) l = 'pl';
  if (crosswordEl.children.length) saveTyped();
  lang = l;
  const t = I18N[l];
  words = t.words;
  KEYWORD = t.keyword;

  document.documentElement.lang = l;
  document.title = t.title;
  document.getElementById('t-h1').innerHTML = t.h1;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-instruction').innerHTML = fmt(t.instruction, { n: KEYWORD.length });
  document.getElementById('t-defsTitle').textContent = t.defsTitle;
  document.getElementById('t-defs').innerHTML = t.defs.map((d, i) =>
    `<div class="def-item"><span class="def-num">${i + 1}.</span> ${d}</div>`).join('');
  document.getElementById('t-keywordTitle').textContent = t.keywordTitle;
  document.getElementById('t-check').textContent = t.check;
  const msg = document.getElementById('result-msg');
  msg.className = 'result-msg'; msg.textContent = '';

  buildCrossword();
  (typed[l] || []).forEach((v, i) => { const inp = crosswordEl.querySelectorAll('input')[i]; if (inp) inp.value = v; });
  updateKeyword();

  document.querySelectorAll('.lang-btn').forEach(btn => {
    const on = btn.dataset.lang === l;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if (persist) { try { localStorage.setItem('crosswordLang', l); } catch (e) { /* storage unavailable */ } }
}

document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));

let startLang = 'pl';
try { const saved = localStorage.getItem('crosswordLang'); if (LANGS.includes(saved)) startLang = saved; } catch (e) { /* storage unavailable */ }
setLang(startLang, false);
</script>
